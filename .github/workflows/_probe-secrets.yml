name: Secrets Probe (temporary)

# 临时工作流：验证 workflow 能否读到仓库 Secrets
# 用完即删
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability
        env:
          TEST_SECRET: ${{ secrets.__DSH_TEST_SECRET }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
            echo "❌ secret 未注入（为空）"
            exit 1
          fi
          echo "✅ secret 已注入，长度=${#TEST_SECRET}"
          # 只打印长度和掩码后的前 2 位，避免泄露
          echo "   掩码示例: ${TEST_SECRET:0:2}***"

      - name: Check that undefined secret is empty
        env:
          NOT_DEFINED: ${{ secrets.THIS_SECRET_DOES_NOT_EXIST }}
        run: |
          if [ -z "$NOT_DEFINED" ]; then
            echo "✅ 未定义的 secret 为空（符合预期）"
          else
            echo "❌ 未定义的 secret 居然有值"
            exit 1
          fi
